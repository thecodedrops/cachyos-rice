# Rules / Tags
[[rule.tag_rule]]
id = "*"
layout_name = "dwindle"

# Rules / Windows
# Media Player
[[rule.window_rule]]
app_id = "mpv"
is_floating = 1
width = 960
height = 720

# File Manager
[[rule.window_rule]]
app_id = "hyprfm"
is_floating = 1
width = 960
height = 720

# GTK File Selection
[[rule.window_rule]]
app_id = "xdg-desktop-portal-gtk"
is_floating = 1
width = 960
height = 720

# Satty, Grim, Slurp
[[rule.window_rule]]
app_id = "com.gabm.satty"
no_swallow = 1
is_fullscreen = 0
is_floating = 1

# Satty, Grim, Slurp : Region Selection
[[rule.layer_rule]]
no_animation = 1
no_blur = 1
layer_name = "selection"

# Firefox
[[rule.window_rule]]
app_id = "firefox"
title = "Picture-in-Picture"
width = 480
height = 270
no_swallow = 1
is_fullscreen = 0
is_floating = 1
offset_x = -98
offset_y = -97

[[rule.window_rule]]
app_id = "firefox"
title = "Library"
width = 960
height = 600
is_floating = 1

[[rule.window_rule]]
app_id = "org.telegram.desktop"
is_named_scratchpad = 1
width = 480

